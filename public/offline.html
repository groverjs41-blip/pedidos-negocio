<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - Pedidos Negocio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fcfbf7;
            color: #4b382a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(217, 119, 6, 0.08);
            border: 1px solid rgba(217, 119, 6, 0.1);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #d97706;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #6b5c52;
            margin: 0 0 25px 0;
        }
        .btn {
            display: inline-block;
            background-color: #d97706;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
            cursor: pointer;
            border: none;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #b45309;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🥪🔌</div>
        <h1>Sin conexión a Internet</h1>
        <p>Parece que has perdido la conexión. Para gestionar tus pedidos, revisar la cocina o actualizar cobros, necesitas estar conectado a la red.</p>
        <button class="btn" onclick="window.location.reload()">Reintentar conexión</button>
    </div>
</body>
</html>
