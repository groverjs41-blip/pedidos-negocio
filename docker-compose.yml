services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pedidos-app
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - pedidos-network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: pedidos-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pedidos-network
    depends_on:
      - app

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pedidos-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - .:/var/www
    networks:
      - pedidos-network
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: pedidos-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - pedidos-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  pedidos-network:
    driver: bridge

volumes:
  db-data:
    driver: local
