services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-stage
    container_name: pedidos-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads-data:/var/www/storage/app/public
    networks:
      - pedidos-network
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-stage
    container_name: pedidos-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - uploads-data:/var/www/public/storage
    networks:
      - pedidos-network
    depends_on:
      - app

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-stage
    container_name: pedidos-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    networks:
      - pedidos-network
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: pedidos-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - pedidos-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  pedidos-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  uploads-data:
    driver: local
